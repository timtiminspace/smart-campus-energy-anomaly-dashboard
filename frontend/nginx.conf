# Reverse-proxy + static SPA on the same origin. The Surrey VM gateway only
# forwards to one port (3000 → 80 inside this container), so this nginx fans
# out: /api/* and /ws to the Go backend, everything else to the React bundle.
upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (anomaly stream) ────────────────────────────────────────
    location /ws {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # ── SPA static assets ─────────────────────────────────────────────────
    # Hashed Vite assets are immutable.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html so a redeploy always lands on the new bundle.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback — every unknown path serves index.html so React Router can
    # handle /log, /report, etc. without a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
